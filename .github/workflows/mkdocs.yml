name: mkdocs
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: uv sync --locked --only-group docs

      - run: uv run --no-sync mkdocs gh-deploy --force

      - name: Commit 'docs/unittest' folder to 'gh-pages'
        run: |
          git fetch
          git checkout gh-pages
          git checkout main -- docs/unittest
          mv docs/unittest unittest
          git add unittest
          git commit -m "Add '/docs/unittest' folder from 'main' branch to /unittest"
          git push origin gh-pages
